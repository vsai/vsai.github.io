# Consulting packages rendered by consultancy.md, grouped into sections.
#
# Paid package: paste its Stripe Payment Link (https://buy.stripe.com/...) into
#   `payment_link`. Package without a payment_link falls back to an email CTA
#   (mailto with `cta_subject`). Leave `price_display` blank to hide the price line.

sections:
  - title: Advisory
    blurb: A focused, senior read on the decision in front of you.
    packages:
      - id: fractional-cto-advisory-call
        name: Fractional CTO Advisory Call
        price_display: "$280 · 60 minutes"
        blurb: >-
          One hour on whatever's blocking you — architecture, hiring, fundraising, a
          stuck technical call. You bring the problem, we work it live. You leave with
          a decision, an action plan, and expected KPIs.
        cta_label: "Book a call →"
        payment_link: "https://buy.stripe.com/9B64gyahC6s63vb5NW3wQ02"

  - title: Practical AI
    blurb: Get AI working in your business — from a hands-on team session to a built system.
    packages:
      - id: ai-workflow-lab
        name: AI Workflow Lab
        price_display: "$998 · 3 hours"
        blurb: >-
          Three hours, hands-on, with your team. We pick one real process from your
          business and build the AI workflow for it together, live, on your own stack.
          Outcome: your team leaves able to build the next one themselves — no
          dependency on me.
        cta_label: "Book the lab →"
        payment_link: "https://buy.stripe.com/dRm14m3TeaIm5Djeks3wQ00"

      - id: ai-workflow-engine
        name: AI Workflow Engine
        price_display: "$1,490 · fixed scope"
        blurb: >-
          I scope one real process in your business and build the production AI
          workflow for it myself, end to end. Handed over running, with prompts and
          tooling documented so your team can operate and extend it.
        cta_label: "Get started →"
        payment_link: "https://buy.stripe.com/bJe5kCgG0dUyghX4JS3wQ01"

  - title: Long-term
    blurb: Deeper engagements — a full review, or an ongoing hand on the technical tiller.
    packages:
      - id: technical-due-diligence
        name: Technical Due Diligence
        price_display: "Custom · ~1 week"
        blurb: >-
          I review the codebase, architecture, and how the team actually ships —
          firsthand, over about a week. You get a clear, decision-ready report: what's
          solid, what's not, and what it means for your call.
        cta_label: "Get in touch →"
        cta_subject: "Technical Due Diligence"

      - id: fractional-cto
        name: Fractional CTO
        price_display: ""
        blurb: >-
          I plug in as your CTO — setting technical direction, unblocking the build,
          reviewing what ships. Ongoing, week over week, not a one-off project. You get
          a senior technical partner without a full-time hire.
        cta_label: "Enquire →"
        cta_subject: "Fractional CTO"
